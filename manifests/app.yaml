apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-demo-deployment
  labels:
    app: k8s-demo
spec:
  replicas: 3 # 고가용성을 위해 3대의 컨테이너 항시 유지
  selector:
    matchLabels:
      app: k8s-demo
  template:
    metadata:
      labels:
        app: k8s-demo
    spec:
      containers:
      - name: demo-app
        image: dydcjsrjaror/k8s-demo-app:latest
        imagePullPolicy: Always    # 1대 서버 내부 로컬에 있는 이미지를 바로 쓰도록 설정 (실무 팁)
        ports:
        - containerPort: 3000
        
        # [실무 핵심] 헬스 체크 설정 (Self-Healing의 기준이 됩니다)
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-demo-service
spec:
  type: NodePort # 1대 서버 환경에서 외부에 서비스를 노출하는 가장 확실한 방법
  selector:
    app: k8s-demo
  ports:
  - port: 80         # 서비스가 사용하는 대표 포트
    targetPort: 3000 # 컨테이너 내부 포트와 매핑
    nodePort: 30030  # 외부에서 직접 치고 들어올 Rocky Linux의 물리 포트 고정!
